name: Supabase

# Fase 2. Se activa solo si cargaste los secrets SUPABASE_*.
on:
  push:
    branches: [main]
    paths: ["data/**", "public/puzzles/**", "supabase/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: ¿Está configurado?
        id: cfg
        run: echo "on=$([ -n "$SUPABASE_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.on == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.on == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.cfg.outputs.on == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.on == 'true'
        with:
          version: latest
      - name: Migraciones de base de datos
        if: steps.cfg.outputs.on == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy de la función api
        if: steps.cfg.outputs.on == 'true'
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Sincronizar eventos y partidas
        if: steps.cfg.outputs.on == 'true'
        run: npm run sync
